services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldnote
      POSTGRES_USER: fieldnote
      POSTGRES_PASSWORD: fieldnote_dev
    ports:
      - "5432:5432"
    volumes:
      - fieldnote-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnote -d fieldnote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fieldnote-postgres: